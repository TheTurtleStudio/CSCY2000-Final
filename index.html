<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav
        class="shu-navbar"
        aria-label="Southern Hogwarts University navigation"
      >
        <div class="nav-wrapper">
          <a href="index.html" class="nav-home">Southern Hogwarts University</a>
          <button
            class="nav-toggle"
            aria-expanded="false"
            aria-controls="nav-links"
          >
            <span></span><span></span><span></span>
          </button>
          <ul id="nav-links" class="nav-list">
            <li><a href="/CSCY2000-Final/deans.html">Deans</a></li>
            <li>
              <a href="/CSCY2000-Final/areas_of_study.html">Areas of Study</a>
            </li>
            <li><a href="/CSCY2000-Final/sports.html">Sports</a></li>
            <li>
              <a href="/CSCY2000-Final/student_life.html">Student Life</a>
            </li>
            <li>
              <a href="/CSCY2000-Final/areas_of_study.html" class="nav-apply"
                >Apply</a
              >
            </li>
          </ul>
        </div>
      </nav>
      <script>
        document.addEventListener("DOMContentLoaded", () => {
          const toggle = document.querySelector(".nav-toggle");
          const nav = document.getElementById("nav-links");

          toggle.addEventListener("click", (e) => {
            e.stopPropagation();
            const isExpanded = toggle.getAttribute("aria-expanded") === "true";
            toggle.setAttribute("aria-expanded", !isExpanded);
            nav.classList.toggle("active");
          });

          // Close when clicking outside
          document.addEventListener("click", (e) => {
            if (
              !e.target.closest(".shu-navbar") &&
              nav.classList.contains("active")
            ) {
              nav.classList.remove("active");
              toggle.setAttribute("aria-expanded", "false");
            }
          });
        });
      </script>
    </header>
    <main>
      <h1>Main Page</h1>
    </main>
  </body>
</html>
